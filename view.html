<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0A09">
<title>Fire Tigers Lineup</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}
:root{color-scheme:light dark}</style>
<link rel="stylesheet" href="app/app.css?v=20260914191716">
<style>
.ordered{counter-reset:bat}
.ordered .row{gap:12px}
.slot{font-family:Oswald,"Arial Narrow",sans-serif;font-size:13px;font-weight:600;
  color:var(--ink-3);width:22px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.inn{border-top:1px solid var(--line)}
.inn:first-child{border-top:0}
.innhead{font-family:Oswald,"Arial Narrow",sans-serif;font-size:11.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);
  padding:13px 12px;cursor:pointer;list-style:none;display:flex;
  align-items:center;justify-content:space-between}
.innhead::-webkit-details-marker{display:none}
.innhead::after{content:"＋";font-size:14px;color:var(--ink-3);letter-spacing:0}
.inn[open] .innhead{color:var(--ink);border-bottom:1px solid var(--line)}
.inn[open] .innhead::after{content:"−"}
.inn[open] .innhead{background:var(--accent-soft)}
.inn.planned .innhead{color:var(--ink-3)}
.stat{font-size:11.5px;color:var(--ink-3);text-align:center;padding:10px 16px 0;
  line-height:1.5;margin:0}
.stat.warn{color:var(--warn)}
</style>
</head>
<body>

<div class="shell">
  <header class="gamebar">
    <div class="gb-top">
      <img class="gb-logo" src="logo.png" alt="">
      <div class="gb-id">
        <div class="gb-team">Fire Tigers &middot; WGLL Single A</div>
        <h1 class="gb-opp" id="opp">Loading…</h1>
        <div class="gb-meta" id="meta"></div>
      </div>
    </div>
  </header>

  <main>
    <div id="body"></div>
  </main>

  <p class="stat" id="stat"></p>
  <p class="foot">Family view &mdash; read only.<br>Updates itself every 30 seconds.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app/config.js?v=20260914191716"></script>
<script>
(function () {
  'use strict';
  // The token lives in the URL fragment, which browsers do not send to servers
  // and which stays out of referrer headers. It is the whole credential, so the
  // page asks for nothing else and can write nothing.
  var token = (location.hash || '').replace(/^#/, '').trim();
  var $ = function (s) { return document.querySelector(s); };
  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x != null) n.textContent = x;
    return n;
  }

  function hardFail(msg) {
    $('#opp').textContent = 'Fire Tigers';
    $('#meta').textContent = '';
    $('#body').innerHTML = '';
    $('#body').appendChild(el('div', 'empty', msg));
    $('#stat').textContent = '';
  }

  if (!token) {
    hardFail('This link is missing its code. Ask Coach Ty to re-send the full link.');
    return;
  }
  if (!window.supabase || !window.supabase.createClient || !window.FT_CONFIG) {
    hardFail('Could not load the page properly. Check your signal and reload.');
    return;
  }

  var sb = window.supabase.createClient(
    window.FT_CONFIG.supabaseUrl, window.FT_CONFIG.publishableKey,
    { auth: { persistSession: false } });

  // Which innings the reader opened themselves. Null until they genuinely touch
  // one — a programmatic `open` also fires `toggle` (the spec queues it as a
  // task), which used to populate this on the first render and stop the current
  // inning auto-following for the rest of the game.
  var userOpened = null, suppressToggle = false;
  var haveRendered = false;          // has a good payload ever reached the DOM
  var lastLoadedAt = null;
  var inFlight = 0;                  // drop a slow reply a newer one already beat

  var IF = { P: 1, C: 1, '1B': 1, '2B': 1, '3B': 1, SS: 1 };
  var ORDER = ['P', 'C', '1B', '2B', '3B', 'SS', 'LF', 'LCF', 'CF', 'RCF', 'RF'];

  function clockLabel(d) {
    return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  /* A failed refresh must not destroy a good screen. Everything else in this app
     survives a dead signal; this page used to blank itself the moment the
     network blinked. */
  function softFail() {
    if (!haveRendered) {
      hardFail('Could not load the lineup. Check your signal and try again.');
      return;
    }
    var s = $('#stat');
    s.className = 'stat warn';
    s.textContent = 'Showing the lineup from ' + clockLabel(lastLoadedAt) +
      ' — could not reach the server just now, still trying.';
  }

  function render(d) {
    var g = d.game;
    var when = new Date(g.starts_at);
    var played = g.innings_played || 0;
    var live = g.status === 'live';

    $('#opp').textContent = (g.home_away === 'away' ? '@ ' : 'vs. ') + (g.opponent || '');
    $('#meta').textContent = when.toLocaleDateString(undefined,
      { weekday: 'short', month: 'short', day: 'numeric' }) + ' · ' + clockLabel(when) +
      (live ? ' · in progress' : (g.status === 'final' ? ' · final' : ''));

    var body = $('#body');
    body.innerHTML = '';

    if (d.batting && d.batting.length) {
      body.appendChild(el('div', 'eyebrow', 'Batting order'));
      body.appendChild(el('div', 'sp-s'));
      var bl = el('div', 'panel list ordered');
      d.batting.forEach(function (n, i) {
        var r = el('div', 'row');
        r.appendChild(el('span', 'slot', String(i + 1)));
        r.appendChild(el('span', 'nm', n));
        bl.appendChild(r);
      });
      body.appendChild(bl);
      if (!d.order_set) {
        body.appendChild(el('p', 'stat', 'Not set yet — this is roster order.'));
      }
      body.appendChild(el('div', 'sp'));
    }

    if (d.lineup && d.lineup.length) {
      body.appendChild(el('div', 'eyebrow', 'Positions'));
      body.appendChild(el('div', 'sp-s'));

      var byInn = {};
      d.lineup.forEach(function (a) {
        (byInn[a.inning] = byInn[a.inning] || []).push(a);
      });
      var innings = Object.keys(byInn).sort(function (a, b) { return a - b; });

      function wasPlayed(inn) {
        return byInn[inn].some(function (a) { return a.actual; });
      }

      // "On now" is the first inning NOT yet marked played, and only while the
      // game is live. Trusting innings_played + 1 alone pointed at a planned
      // inning that would never happen once the game ended.
      var current = null;
      if (live) {
        for (var k = 0; k < innings.length; k++) {
          if (!wasPlayed(innings[k])) { current = innings[k]; break; }
        }
        if (current === null && innings.indexOf(String(played + 1)) > -1) {
          current = String(played + 1);
        }
      }

      var panel = el('div', 'panel list');
      suppressToggle = true;
      innings.forEach(function (inn) {
        var isNow = inn === current;
        var done = wasPlayed(inn);
        var box = document.createElement('details');
        box.className = 'inn' + (!done && !isNow ? ' planned' : '');
        box.open = userOpened ? !!userOpened[inn] : isNow;
        box.addEventListener('toggle', function () {
          if (suppressToggle) return;          // programmatic, not the reader
          if (!userOpened) {
            userOpened = {};
            innings.forEach(function (x) { userOpened[x] = (x === current); });
          }
          userOpened[inn] = box.open;
        });
        var head = document.createElement('summary');
        head.className = 'innhead';
        head.textContent = 'Inning ' + inn +
          (isNow ? ' · on now' : (done ? ' · played' : ' · planned'));
        box.appendChild(head);
        byInn[inn].sort(function (a, b) {
          return ORDER.indexOf(a.position) - ORDER.indexOf(b.position);
        }).forEach(function (a) {
          var r = el('div', 'row');
          r.appendChild(el('span', 'chip ' +
            (a.position === 'C' ? 'c' : (IF[a.position] ? 'if' : 'of')), a.position));
          r.appendChild(el('span', 'nm', a.player));
          box.appendChild(r);
        });
        panel.appendChild(box);
      });
      // toggle is queued as a task, so clear the guard in a task too.
      setTimeout(function () { suppressToggle = false; }, 0);
      body.appendChild(panel);
    } else {
      body.appendChild(el('div', 'empty',
        'The lineup for this game is not posted yet. Check back closer to game time.'));
    }

    haveRendered = true;
    lastLoadedAt = new Date();
    var s = $('#stat');
    s.className = 'stat';
    s.textContent = 'Updated ' + clockLabel(lastLoadedAt);
  }

  function load() {
    var seq = ++inFlight;
    return sb.rpc('shared_lineup', { p_token: token }).then(function (r) {
      if (seq !== inFlight) return;          // a newer refresh already answered
      if (r.error) { softFail(); return; }

      var d = r.data;
      if (!d) {
        hardFail('This link is no longer active. Ask Coach Ty for the current one.');
        return;
      }
      if (!d.game) {
        // A working link with nothing scheduled is NOT a dead link. Saying so
        // used to send parents to Ty asking for a replacement.
        $('#opp').textContent = 'No game posted right now';
        $('#meta').textContent = '';
        $('#body').innerHTML = '';
        $('#body').appendChild(el('div', 'empty',
          'Nothing scheduled at the moment. This link keeps working — check back ' +
          'before the next game.'));
        $('#stat').textContent = '';
        haveRendered = false;
        return;
      }
      render(d);
    }).catch(function () {
      if (seq !== inFlight) return;
      softFail();
    });
  }

  load();
  // Parents watching from the bleachers should not have to pull-to-refresh every
  // half inning. Poll while the tab is actually in front.
  setInterval(function () {
    if (document.visibilityState === 'visible') load();
  }, 30000);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') load();
  });
}());
</script>
</body>
</html>
